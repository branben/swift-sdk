# Conformance baseline for the spec this SDK targets: 2025-11-25
#
# Passed to the suite as --expected-failures. It must contain `client:` and
# `server:` as ARRAYS OF SCENARIO NAMES — the suite rejects anything else with
# "'server' must be an array of scenario names". Keep documentation in comments;
# nested keys break the flag.
#
# Empty arrays are the correct and strongest state: every scenario must pass.
# Add just a failing scenario name here when one appears.
#
# Measured 2026-09-25, macOS 26.5.1 arm64, sequential via
# scripts/run-conformance.sh against @modelcontextprotocol/conformance@0.1.16.
# Deterministic: three consecutive runs returned an identical 32/32.
#
# Numbers are only meaningful with BOTH the suite version and the spec revision
# pinned, because the scenario set changes between suite releases. An earlier
# run of the harness pinned neither and ran scenarios in parallel, so it
# reported 2-3 varying failures on this spec that did not exist: a single server
# cannot hold several server->client round trips open at once, the later ones
# timed out (-32001), and the victim set changed every run.
#
# Progress toward the newer spec is tracked separately in
# conformance-baseline-2026-07-28.yml, which is passed explicitly with
# BASELINE_FILE and is not the default.

client: []

server: []
